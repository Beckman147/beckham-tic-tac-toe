<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Play Tic Tac Toe against the computer — four difficulty levels, from Easy to unbeatable God Mode." />
<meta name="theme-color" content="#6366f1" />
<title>Tic Tac Toe</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="styles.css" />

<main class="app">
  <header class="app__header">
    <h1 class="app__title">Tic&nbsp;Tac&nbsp;Toe</h1>
    <p class="app__subtitle">You vs. the computer</p>
  </header>

  <section class="controls" aria-label="Game settings">
    <div class="control">
      <label class="control__label" for="difficulty">Difficulty</label>
      <select id="difficulty" class="control__input">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard" selected>Hard</option>
        <option value="god">God Mode</option>
      </select>
    </div>

    <div class="control">
      <span class="control__label" id="side-label">Play as</span>
      <div class="segmented" role="radiogroup" aria-labelledby="side-label">
        <button type="button" class="segmented__btn is-active" data-side="X" role="radio" aria-checked="true">X</button>
        <button type="button" class="segmented__btn" data-side="O" role="radio" aria-checked="false">O</button>
      </div>
    </div>
  </section>

  <p class="status" id="status" role="status" aria-live="polite">Your turn</p>

  <div class="board" id="board" role="grid" aria-label="Tic Tac Toe board">
    <!-- 9 cells injected by script.js -->
  </div>

  <div class="actions">
    <button type="button" class="btn btn--primary" id="new-game">New Game</button>
  </div>

  <section class="scoreboard" aria-label="Scoreboard">
    <div class="score">
      <span class="score__label">You</span>
      <span class="score__value" id="score-wins">0</span>
    </div>
    <div class="score">
      <span class="score__label">Draws</span>
      <span class="score__value" id="score-draws">0</span>
    </div>
    <div class="score">
      <span class="score__label">Computer</span>
      <span class="score__value" id="score-losses">0</span>
    </div>
  </section>

  <button type="button" class="btn btn--ghost" id="reset-score">Reset score</button>

  <footer class="app__footer">
    <span>Built with vanilla JS · hosted on GitHub Pages</span>
  </footer>
</main>

<script src="script.js"></script>
